<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18221f">
<title>Back Gear — Management</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/app-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Back Gear">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/app-theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-body">

<!-- ============ LOGIN ============ -->
<div class="login" id="loginScreen">
  <main class="login-card">
    <svg class="login-logo" aria-hidden="true"><use href="/assets/icons.svg#brand-mark"/></svg>
    <h1 class="login-wordmark">BACK<i>GEAR</i></h1>
    <p class="login-sub">Driving School — Staff Login</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label class="label" for="lgEmail">Email or phone</label>
        <input class="control" id="lgEmail" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="label" for="lgPass">Password</label>
        <div class="pw-wrap">
          <input class="control" id="lgPass" name="password" type="password" autocomplete="current-password" required>
          <button class="pw-toggle" type="button" id="pwToggle" aria-label="Show password">
            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-eye"/></svg>
          </button>
        </div>
      </div>
      <p class="error-text" id="loginError" hidden></p>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Login</button>
    </form>

    <div class="login-demo">
      <p><b>Try the demo</b> — choose which portal to open</p>
      <div class="login-roles">
        <button class="btn btn-primary btn-block" type="button" data-demo-login="admin">
          <span class="lr-name">Open Admin Demo</span>
          <span class="lr-note">Run the whole school</span></button>
        <button class="btn btn-block" type="button" data-demo-login="trainer">
          <span class="lr-name">Open Trainer Demo</span>
          <span class="lr-note">Harpreet Singh — today's classes only</span></button>
      </div>
      <p class="login-note">Password for both demo accounts is <b>demo123</b>. This is a prototype
        sign-in, not real security.</p>
    </div>
    <p class="login-back"><a href="/">&larr; Back to the website</a></p>
  </main>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app" hidden>


  <aside class="sidebar" id="sidebar" aria-label="Sections">
    <div class="sidebar-brand">
      <svg class="sidebar-logo" aria-hidden="true"><use href="/assets/icons.svg#brand-mark"/></svg>
      <span class="logo-text"><b>BACK<i>GEAR</i></b><small>Management</small></span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-role"><span id="roleBadge"></span></div>
    <div class="sidebar-foot">
      <button class="btn btn-sm btn-block" id="signOutDesktop">
        <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#i-log-out"/></svg>Sign out</button>
    </div>
  </aside>

  <header class="topbar">
    <button class="topbar-back" id="topBack" hidden aria-label="Go back">
      <svg class="icon icon-lg" aria-hidden="true"><use href="/assets/icons.svg#i-arrow-left"/></svg>
    </button>
    <div class="topbar-title">
      <h1 id="pageTitle">Home</h1>
      <p id="pageSub"></p>
    </div>
    <div class="topbar-actions" id="topActions"></div>
  </header>

  <main class="content" id="view" tabindex="-1"></main>

  <nav class="bottomnav" id="bottomNav" aria-label="Main"></nav>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="sheetTitle">Form</h2>
      <button class="btn btn-sm btn-icon" type="button" data-close-sheet aria-label="Close">
        <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-x"/></svg>
      </button>
    </div>
    <form id="sheetForm">
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot" id="sheetFoot"></div>
    </form>
  </div>
</dialog>

<script type="module" src="/js/app/main.js"></script>
</body>
</html>
